<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb">
<title>모의고사 성적 조회 | 청운학사</title>
<style>
:root{--bg:#fff;--ink:#111;--muted:#666;--line:#dedede;--soft:#f5f5f5;--danger:#111;--focus:#111}*{box-sizing:border-box}html{background:#fff}body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px;line-height:1.5;letter-spacing:-.015em}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.hidden{display:none!important}.shell{width:100%;min-height:100svh;margin:0;padding:32px 22px 56px;display:flex;flex-direction:column;align-items:center;justify-content:center}.login{width:min(100%,380px);margin:auto}.login-kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin:0 0 24px}.login h1{font-size:29px;line-height:1.2;letter-spacing:-.055em;font-weight:750;margin:0 0 9px}.login-intro{font-size:13px;color:var(--muted);margin:0 0 32px}.field{margin:0 0 19px}.field label{display:block;font-size:12px;font-weight:650;margin-bottom:8px}.field input,.field select,.field textarea,.search input{display:block;width:100%;min-width:0;min-height:49px;border:1px solid #bdbdbd;border-radius:0;background:#fff;padding:12px 13px;outline:none;box-shadow:none}.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{border-color:#111;outline:1px solid #111;outline-offset:-1px}.field input::placeholder,.search input::placeholder{color:#999}.btn{border:1px solid #111;border-radius:0;min-height:43px;padding:10px 14px;background:#fff;color:#111;font-size:13px;font-weight:650;transition:background .15s,color .15s}.btn:hover{background:#f2f2f2}.btn.primary{background:#111;color:#fff}.btn.primary:hover{background:#333}.btn.danger{background:#fff;color:#111;border-color:#999}.btn.small{min-height:32px;padding:6px 9px;font-size:12px}.lookup-btn{width:100%;min-height:51px;margin-top:4px}.message{min-height:20px;margin:13px 0 0;font-size:12px;color:var(--muted)}.error{color:#111!important;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}.success{color:#111!important}.login-foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:#777;display:flex;justify-content:space-between;gap:12px}.result-view{width:min(100%,900px);margin:0 auto;align-self:stretch}.result-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:23px;border-bottom:1px solid #111}.result-head h1{font-size:28px;line-height:1.2;letter-spacing:-.05em;margin:5px 0 7px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#666}.muted{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.result-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line);margin-bottom:30px}.summary-item{padding:19px 18px 20px 0;border-right:1px solid var(--line)}.summary-item+.summary-item{padding-left:18px}.summary-item:last-child{border-right:0}.summary-label{font-size:11px;color:#666;margin-bottom:8px}.summary-value{font-size:27px;font-weight:750;letter-spacing:-.05em;line-height:1.1}.summary-unit{font-size:12px;font-weight:500;margin-left:4px}.result-section{margin:28px 0 0}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:13px}.section-head h2{font-size:16px;letter-spacing:-.03em;margin:0;font-weight:750}.score-table-wrap{overflow:auto;border-top:1px solid #111}.score-table{border-collapse:collapse;width:100%;font-size:13px}.score-table th,.score-table td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.score-table th{font-size:11px;color:#555;font-weight:650;background:#fff}.score-table td:first-child{font-weight:650}.cutoff-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid #111}.cutoff-item{padding:14px 14px 14px 0;border-bottom:1px solid var(--line)}.cutoff-item:nth-child(3n+2),.cutoff-item:nth-child(3n+3){padding-left:14px;border-left:1px solid var(--line)}.cutoff-title{font-size:12px;font-weight:700;margin-bottom:7px}.cutoff-line{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#555;padding:3px 0}.cutoff-line strong{font-size:11px;color:#111}.result-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:34px;padding-top:16px;border-top:1px solid #111}.empty{padding:22px 0;font-size:13px;color:#666}.admin{position:fixed;inset:0;z-index:30;overflow:auto;background:#fff}.admin-wrap{max-width:1160px;margin:auto;padding:24px 26px 48px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:19px;border-bottom:1px solid #111;margin-bottom:22px}.admin-head h1{font-size:22px;letter-spacing:-.045em;margin:4px 0 0}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.admin-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:30px}.nav{height:max-content;position:sticky;top:20px;display:flex;flex-direction:column;border-top:1px solid #111}.nav button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:12px 10px;font-size:13px;font-weight:600}.nav button.active{background:#111;color:#fff}.admin-main{min-width:0}.admin-main h2{font-size:20px;letter-spacing:-.04em;margin:0 0 5px}.admin-title{margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #111;border-bottom:1px solid var(--line);margin:20px 0 26px}.stat{padding:16px 16px 18px 0;border-right:1px solid var(--line)}.stat+.stat{padding-left:16px}.stat:last-child{border-right:0}.stat span{font-size:11px;color:#666}.stat strong{display:block;font-size:27px;line-height:1.2;margin-top:7px;font-weight:750;letter-spacing:-.04em}.formbox{border-top:1px solid #111;border-bottom:1px solid var(--line);padding:18px 0;margin:20px 0}.formbox h3{font-size:14px;margin:0 0 12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.row-actions{display:flex;gap:5px}.tablewrap{overflow:auto;border-top:1px solid #111}.table{border-collapse:collapse;width:100%;min-width:500px;font-size:12px}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;font-weight:650;color:#555;background:#fff}.search{display:flex;gap:8px;margin:14px 0}.search input{flex:1}.notice{border-left:2px solid #111;padding:10px 13px;margin:16px 0;font-size:12px;line-height:1.7;color:#444;background:#fafafa}.admin-msg{font-size:12px;color:#555;line-height:1.6;margin-top:13px}.empty{text-align:center;padding:25px 12px;color:#666;font-size:13px}.error-text{color:#111;text-decoration:underline}.cutoff-row{display:grid;grid-template-columns:1.5fr .7fr .8fr auto;gap:8px;align-items:end}.cutoff-row .field{margin:0}.cutoff-row .field input{min-height:42px}.admin-footer{font-size:11px;color:#777;margin-top:30px;padding-top:13px;border-top:1px solid var(--line)}
@media(max-width:720px){.shell{padding:24px 20px}.login{max-width:360px}.result-view{width:100%}.result-head h1{font-size:24px}.result-summary{grid-template-columns:repeat(3,minmax(0,1fr))}.summary-item{padding:15px 10px 16px 0}.summary-item+.summary-item{padding-left:10px}.summary-value{font-size:23px}.cutoff-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cutoff-item:nth-child(3n+2),.cutoff-item:nth-child(3n+3){padding-left:0;border-left:0}.cutoff-item:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}.admin-wrap{padding:16px 15px 34px}.admin-grid{grid-template-columns:1fr;gap:18px}.nav{position:static;flex-direction:row;overflow-x:auto;border-bottom:1px solid #111;border-top:0}.nav button{width:auto;white-space:nowrap;flex:0 0 auto;border-top:1px solid #111;border-bottom:0}.admin-main{padding:0}.admin-head h1{font-size:19px}.stats{margin-top:15px}.stat{padding:13px 10px 14px 0}.stat+.stat{padding-left:10px}.stat strong{font-size:23px}}
@media(max-width:430px){.login h1{font-size:27px}.login-intro{margin-bottom:27px}.result-head{align-items:flex-start}.result-head h1{font-size:22px}.result-summary{margin-bottom:24px}.summary-label{font-size:10px}.summary-value{font-size:20px}.summary-item{padding-right:7px}.summary-item+.summary-item{padding-left:7px}.score-table th,.score-table td{padding:11px 9px}.cutoff-grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.cutoff-row{grid-template-columns:1fr 1fr}.cutoff-row .btn{grid-column:1/-1}.admin-head{align-items:flex-start;flex-direction:column}.result-actions{align-items:flex-start}}
 .login-kicker,.login-foot{display:none!important}
</style>
</head>
<body>
<div id="studentApp" class="shell">
  <main class="login" id="loginView">
    <p class="login-kicker">CHEONGUN HAKSA / EXAM</p>
    <h1>성적 조회</h1>
    <p class="login-intro">개인 식별코드와 생년월일을 입력하세요.</p>
    <form id="lookupForm">
      <div class="field"><label for="studentCode">개인 식별코드</label><input id="studentCode" maxlength="6" pattern="[A-Za-z0-9]{6}" autocomplete="off" autocapitalize="characters" placeholder="영문·숫자 6자리" required></div>
      <div class="field"><label for="birthdate">생년월일</label><input id="birthdate" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" autocomplete="off" placeholder="YYYYMMDD" required></div>
      <button class="btn primary lookup-btn" id="lookupButton">확인하기</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <div class="login-foot"><span>청운학사</span><span>MOCK EXAM RESULTS</span></div>
  </main>
  <main id="studentResultsView" class="result-view hidden">
    <header class="result-head"><div><div class="eyebrow">CHEONGUN HAKSA / EXAM RESULTS</div><h1>모의고사 성적표</h1><p class="muted">과목별 점수와 응시 집단 기준 결과</p></div><button class="btn" id="studentLogout">나가기</button></header>
    <section class="result-summary" id="resultSummary"></section>
    <section class="result-section"><div class="section-head"><h2>과목별 성적</h2><span class="muted" id="scoreCount"></span></div><div id="scoreList"></div></section>
    <section class="result-section"><div class="section-head"><h2>등급별 기준 점수</h2><span class="muted">등록된 컷 기준</span></div><div id="cutoffList" class="cutoff-grid"></div></section>
    <div class="result-actions"><p class="muted">석차·평균은 해당 과목의 등록 성적을 기준으로 산출합니다.</p><button class="btn" id="studentLogout2">로그아웃</button></div>
  </main>
</div>
<div id="adminApp" class="admin hidden"><div class="admin-wrap"><header class="admin-head"><div><div class="eyebrow">CHEONGUN HAKSA · ADMIN</div><h1>성적 관리 센터</h1></div><div class="actions"><button class="btn quiet" id="backStudent">학생 화면</button><button class="btn danger" id="logout">로그아웃</button></div></header><div class="admin-grid"><nav class="card nav"><button class="active" data-view="dashboard">대시보드</button><button data-view="students">학생 관리</button><button data-view="scores">성적 관리</button><button data-view="bulk">일괄 입력</button><button data-view="cutoffs">등급 컷</button></nav><main class="card admin-main"><div id="adminContent"></div><p id="adminMessage" class="admin-msg" role="status"></p></main></div></div></div>
<script>
const SUPABASE_URL="https://gcajxrcyitsslwulyvjr.supabase.co";
const ADMIN_URL=SUPABASE_URL+"/functions/v1/admin-management";
const $=id=>document.getElementById(id);let adminToken="";
const admin=$("adminApp"),content=$("adminContent"),adminMsg=$("adminMessage");let students=[],scores=[],cutoffs=[];
function showLogin(){$("loginView").classList.remove("hidden");$("studentResultsView").classList.add("hidden");$("studentCode").value="";$("birthdate").value="";$("message").textContent="";$("message").className="message";$("studentCode").focus()}
$("studentLogout").onclick=showLogin;$("studentLogout2").onclick=showLogin;
$("lookupForm").addEventListener("submit",async e=>{
 e.preventDefault();const code=$("studentCode").value.trim().toUpperCase(),birth=$("birthdate").value.trim(),msg=$("message");msg.className="message";msg.textContent="";
 if(!/^[A-Z0-9]{6}$/.test(code)){msg.textContent="식별코드는 영문·숫자 6자리로 입력해 주세요.";msg.classList.add("error");return}
 if(!/^\d{8}$/.test(birth)){msg.textContent="생년월일은 숫자 8자리로 입력해 주세요.";msg.classList.add("error");return}
 $("lookupButton").disabled=true;msg.textContent="확인 중…";
 try{
   if(SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR"))throw Error("기존 Supabase 공개용 Publishable Key를 index.html에 설정해 주세요.");
   if(code.startsWith("M")){
     const r=await fetch(ADMIN_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action:"lookup_student",student_code:code,birthdate:birth})});
     const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"식별코드 또는 생년월일을 확인해 주세요.");renderStudentResults(d);return;
   }
   const r=await fetch(ADMIN_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action:"admin_login",admin_code:code,birthdate:birth})});
   const d=await r.json().catch(()=>({}));if(r.status===429)throw Error(d.error||"인증 시도가 많습니다. 잠시 후 다시 시도해 주세요.");if(!r.ok||!d.token)throw Error(d.error||"식별코드 또는 생년월일이 올바르지 않습니다.");
   adminToken=d.token;$("studentApp").classList.add("hidden");admin.classList.remove("hidden");await render("dashboard");
 }catch(err){msg.textContent=err.message||"확인에 실패했습니다. 잠시 후 다시 시도해 주세요.";msg.classList.add("error");}
 finally{$("lookupButton").disabled=false;}
});
function renderStudentResults(data){
 const items=data.scores||[];
 $("loginView").classList.add("hidden");$("studentResultsView").classList.remove("hidden");$("message").textContent="";
 const valid=items.filter(x=>Number.isFinite(Number(x.score)));const avg=valid.length?valid.reduce((a,x)=>a+Number(x.score),0)/valid.length:null;
 const overallRank=data.overall_rank,overallParticipants=data.overall_participants;
 $("resultSummary").innerHTML=`<div class="summary-item"><div class="summary-label">응시 과목</div><div class="summary-value">${valid.length}<span class="summary-unit">과목</span></div></div><div class="summary-item"><div class="summary-label">전체 과목 평균</div><div class="summary-value">${avg===null?"—":avg.toFixed(1)}<span class="summary-unit">점</span></div></div><div class="summary-item"><div class="summary-label">평균 석차</div><div class="summary-value">${overallRank&&overallParticipants?`${overallRank}<span class="summary-unit"> / ${overallParticipants}명</span>`:"—"}</div></div>`;
 $("scoreCount").textContent=`${valid.length}과목`;
 if(!valid.length){$("scoreList").innerHTML='<div class="empty">아직 등록된 성적이 없습니다.</div>';$("cutoffList").innerHTML='<div class="empty">등록된 등급 컷이 없습니다.</div>';return}
 $("scoreList").innerHTML=`<div class="score-table-wrap"><table class="score-table"><thead><tr><th>과목</th><th>점수</th><th>석차</th><th>과목 평균</th><th>등급 기준</th></tr></thead><tbody>${valid.map(x=>`<tr><td>${esc(x.subject)}</td><td>${fmt(x.score)}점</td><td>${x.rank&&x.participant_count?`${x.rank} / ${x.participant_count}`:"—"}</td><td>${x.average===null||x.average===undefined?"—":Number(x.average).toFixed(1)+"점"}</td><td>${x.grade?x.grade+"등급 이내":"—"}</td></tr>`).join("")}</tbody></table></div>`;
 const seen=new Set();const all=valid.flatMap(x=>(x.cutoffs||[]).map(c=>({...c,subject:x.subject}))).filter(c=>{const k=c.subject+"|"+c.grade;if(seen.has(k))return false;seen.add(k);return true;});
 $("cutoffList").innerHTML=all.length?all.sort((a,b)=>a.subject.localeCompare(b.subject,"ko")||Number(a.grade)-Number(b.grade)).map(c=>`<div class="cutoff-item"><div class="cutoff-title">${esc(c.subject)}</div><div class="cutoff-line"><span>${esc(c.grade)}등급 기준</span><strong>${fmt(c.min_score)}점</strong></div></div>`).join(""):'<div class="empty">등급 컷이 등록되지 않았습니다.</div>';
}
function fmt(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString("ko-KR",{maximumFractionDigits:2}):"—"}
function endAdminSession(){adminToken="";admin.classList.add("hidden");$("studentApp").classList.remove("hidden");showLogin()}
$("backStudent").onclick=endAdminSession;$("logout").onclick=endAdminSession;document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>render(b.dataset.view));
async function call(action,payload={}){if(!adminToken)throw Error("관리자 인증이 만료되었습니다. 다시 인증해 주세요.");const r=await fetch(ADMIN_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+adminToken},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({error:"서버 응답 오류"}));if(r.status===401){endAdminSession();throw Error(d.error||"관리자 인증이 만료되었습니다.")}if(!r.ok)throw Error(d.error||"요청 실패");return d}
async function render(view){document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));content.innerHTML='<p class="admin-msg">불러오는 중…</p>';say("");try{const d=await call("dashboard");students=d.students||[];scores=d.scores||[];cutoffs=d.cutoffs||[];if(view==="dashboard")dashboard();if(view==="students")studentView();if(view==="scores")scoreView();if(view==="bulk")bulkView();if(view==="cutoffs")cutoffView()}catch(e){content.innerHTML='<div class="notice">관리 데이터를 불러오지 못했습니다.<br>'+esc(e.message)+'</div>'}}
function dashboard(){content.innerHTML=`<div class="admin-title"><h2>대시보드</h2><p class="muted">등록 데이터 현황</p></div><div class="stats"><div class="stat"><span>등록 학생</span><strong>${students.length}</strong></div><div class="stat"><span>성적 기록</span><strong>${scores.length}</strong></div><div class="stat"><span>등급 컷</span><strong>${cutoffs.length}</strong></div></div><div class="notice">학생 조회와 관리자 작업은 서버에서 별도로 인증·검증됩니다.</div><div class="formbox"><h3>빠른 작업</h3><div class="actions"><button class="btn primary" onclick="render('students')">학생 등록</button><button class="btn quiet" onclick="render('scores')">성적 입력</button><button class="btn quiet" onclick="render('bulk')">일괄 입력</button></div></div>`}
function studentView(){content.innerHTML=`<div class="admin-title"><h2>학생 관리</h2><p class="muted">M으로 시작하는 식별코드 6자리, 생년월일 YYYYMMDD</p></div><form id="sf" class="formbox"><h3 id="sTitle">학생 등록</h3><input id="sid" type="hidden"><div class="grid2"><div class="field"><label>개인 식별코드</label><input id="scode" required maxlength="6" pattern="[Mm][A-Za-z0-9]{5}"></div><div class="field"><label>생년월일</label><input id="sbirth" required maxlength="8" pattern="[0-9]{8}" inputmode="numeric" placeholder="20080115"></div></div><div class="actions"><button class="btn primary">저장</button><button type="button" class="btn quiet" id="sreset">초기화</button></div></form><div class="search"><input id="sq" placeholder="학생 코드 검색"></div><div id="st"></div>`;const draw=()=>{let a=students.filter(s=>s.student_code.includes($("sq").value.trim().toUpperCase()));$("st").innerHTML=a.length?`<div class="tablewrap"><table class="table"><thead><tr><th>코드</th><th>생년월일</th><th>성적 수</th><th>작업</th></tr></thead><tbody>${a.map(s=>`<tr><td>${esc(s.student_code)}</td><td>${esc(s.birthdate)}</td><td>${scores.filter(x=>x.student_id===s.id).length}</td><td><div class="row-actions"><button class="btn quiet small" data-se="${s.id}">수정</button><button class="btn danger small" data-sd="${s.id}">삭제</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">학생 데이터가 없습니다.</div>'};draw();$("sq").oninput=draw;$("sreset").onclick=()=>{$("sf").reset();$("sid").value="";$("sTitle").textContent="학생 등록"};$("sf").onsubmit=async e=>{e.preventDefault();try{await call("save_student",{student:{id:$("sid").value||null,student_code:$("scode").value.trim().toUpperCase(),birthdate:$("sbirth").value.trim()}});say("학생 정보를 저장했습니다.","success");await render("students")}catch(e){say(e.message,"error")}};$("st").onclick=async e=>{let b=e.target.closest("[data-se]"),d=e.target.closest("[data-sd]");if(b){let s=students.find(x=>x.id===b.dataset.se);$("sid").value=s.id;$("scode").value=s.student_code;$("sbirth").value=s.birthdate;$("sTitle").textContent="학생 정보 수정";$("sf").scrollIntoView({behavior:"smooth"})}if(d){let s=students.find(x=>x.id===d.dataset.sd);if(confirm(`${s.student_code} 학생과 연결 성적을 삭제할까요?`))try{await call("delete_student",{id:s.id});say("학생을 삭제했습니다.","success");await render("students")}catch(e){say(e.message,"error")}}}}
function scoreView(){content.innerHTML=`<div class="admin-title"><h2>성적 관리</h2><p class="muted">학생별 과목 성적을 등록·수정·삭제합니다.</p></div><form id="cf" class="formbox"><h3 id="cTitle">성적 등록</h3><input id="cid" type="hidden"><div class="grid2"><div class="field"><label>학생</label><select id="cstudent" required><option value="">학생 선택</option>${students.map(s=>`<option value="${s.id}">${esc(s.student_code)}</option>`).join("")}</select></div><div class="field"><label>과목명</label><input id="csubject" maxlength="80" required placeholder="국어"></div><div class="field"><label>점수 (0~100)</label><input id="cscore" type="number" min="0" max="100" step=".01" required></div></div><div class="actions"><button class="btn primary">성적 저장</button><button type="button" class="btn quiet" id="creset">초기화</button></div></form><div class="search"><input id="cq" placeholder="학생 코드 또는 과목 검색"></div><div id="ct"></div>`;const draw=()=>{let q=$("cq").value.toLowerCase(),a=scores.filter(s=>(students.find(x=>x.id===s.student_id)?.student_code+" "+s.subject).toLowerCase().includes(q));$("ct").innerHTML=a.length?`<div class="tablewrap"><table class="table"><thead><tr><th>학생 코드</th><th>과목</th><th>점수</th><th>작업</th></tr></thead><tbody>${a.map(s=>`<tr><td>${esc(students.find(x=>x.id===s.student_id)?.student_code)}</td><td>${esc(s.subject)}</td><td>${esc(s.score)}</td><td><div class="row-actions"><button class="btn quiet small" data-ce="${s.id}">수정</button><button class="btn danger small" data-cd="${s.id}">삭제</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">성적 데이터가 없습니다.</div>'};draw();$("cq").oninput=draw;$("creset").onclick=()=>{$("cf").reset();$("cid").value="";$("cTitle").textContent="성적 등록"};$("cf").onsubmit=async e=>{e.preventDefault();try{await call("save_score",{score:{id:$("cid").value||null,student_id:$("cstudent").value,subject:$("csubject").value.trim(),score:Number($("cscore").value)}});say("성적을 저장했습니다.","success");await render("scores")}catch(e){say(e.message,"error")}};$("ct").onclick=async e=>{let b=e.target.closest("[data-ce]"),d=e.target.closest("[data-cd]");if(b){let s=scores.find(x=>String(x.id)===b.dataset.ce);$("cid").value=s.id;$("cstudent").value=s.student_id;$("csubject").value=s.subject;$("cscore").value=s.score;$("cTitle").textContent="성적 수정";$("cf").scrollIntoView({behavior:"smooth"})}if(d){let s=scores.find(x=>String(x.id)===d.dataset.cd);if(confirm(`${s.subject} 성적을 삭제할까요?`))try{await call("delete_score",{id:s.id});say("성적을 삭제했습니다.","success");await render("scores")}catch(e){say(e.message,"error")}}}}
function cutoffView(){content.innerHTML=`<div class="admin-title"><div><h2>등급 컷</h2><p class="muted">과목별 등급 기준 점수를 등록합니다.</p></div></div><form id="cutForm" class="formbox"><h3>등급 컷 등록</h3><div class="grid2"><div class="field"><label>과목</label><input id="cutSubject" maxlength="80" required placeholder="국어"></div><div class="field"><label>등급</label><select id="cutGrade" required>${[1,2,3,4,5,6,7,8,9].map(n=>`<option value="${n}">${n}등급</option>`).join("")}</select></div><div class="field"><label>최저 점수</label><input id="cutScore" type="number" min="0" max="100" step=".01" required placeholder="예: 92"></div></div><div class="actions"><button class="btn primary">저장</button></div></form><div id="cutTable"></div>`;const draw=()=>{$("cutTable").innerHTML=cutoffs.length?`<div class="tablewrap"><table class="table"><thead><tr><th>과목</th><th>등급</th><th>기준 점수</th><th></th></tr></thead><tbody>${cutoffs.slice().sort((a,b)=>a.subject.localeCompare(b.subject)||a.grade-b.grade).map(c=>`<tr><td>${esc(c.subject)}</td><td>${c.grade}등급</td><td>${esc(c.min_score)}점</td><td><button class="btn quiet small" data-cutdel="${c.id}">삭제</button></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">등록된 등급 컷이 없습니다.</div>'};draw();$("cutForm").onsubmit=async e=>{e.preventDefault();try{await call("save_cutoff",{subject:$("cutSubject").value.trim(),grade:Number($("cutGrade").value),min_score:Number($("cutScore").value)});const d=await call("dashboard");cutoffs=d.cutoffs||[];draw();$("cutForm").reset();say("등급 컷을 저장했습니다.")}catch(e){say(e.message,"error")}};$("cutTable").onclick=async e=>{const b=e.target.closest("[data-cutdel]");if(!b)return;if(!confirm("이 등급 컷을 삭제할까요?"))return;try{await call("delete_cutoff",{id:b.dataset.cutdel});cutoffs=cutoffs.filter(x=>String(x.id)!==b.dataset.cutdel);draw();say("삭제했습니다.")}catch(e){say(e.message,"error")}}}
function bulkView(){content.innerHTML=`<div class="admin-title"><h2>성적 일괄 입력</h2><p class="muted">여러 학생의 성적을 한 번에 등록합니다.</p></div><div class="notice">한 줄에 <code>학생코드,생년월일,과목,점수</code> 순서로 입력하세요. 예: <code>M1B2C3,20080115,국어,92</code><br>헤더 행은 선택 사항이며, 기존 학생·과목 조합은 점수를 업데이트합니다.</div><form id="bf" class="formbox"><div class="field"><label>CSV 또는 탭으로 구분한 데이터</label><textarea id="bdata" rows="10" required placeholder="student_code,birthdate,subject,score&#10;M1B2C3,20080115,국어,92&#10;M1B2C3,20080115,수학,88"></textarea></div><div class="actions"><button class="btn primary">검증 후 일괄 저장</button><button type="button" class="btn quiet" id="bclear">비우기</button></div></form><div id="bresult"></div>`;$("bclear").onclick=()=>{$("bdata").value="";$("bresult").innerHTML=""};$("bf").onsubmit=async e=>{e.preventDefault();let lines=$("bdata").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),records=[],invalid=0;for(let i=0;i<lines.length;i++){let c=(lines[i].includes("\t")?lines[i].split("\t"):lines[i].split(",")).map(x=>x.trim().replace(/^"|"$/g,""));if(i===0&&/student.?code|식별코드/i.test(c[0]))continue;if(c.length<4||!/^[M][A-Za-z0-9]{5}$/.test(c[0].toUpperCase())||!/^\d{8}$/.test(c[1])||!c[2]||!Number.isFinite(Number(c[3]))||Number(c[3])<0||Number(c[3])>100){invalid++;continue}records.push({student_code:c[0].toUpperCase(),birthdate:c[1],subject:c[2],score:Number(c[3])})}if(!records.length){say("저장 가능한 행이 없습니다.","error");return}if(!confirm(`${records.length}개 행 저장, 형식 오류 ${invalid}개 제외. 계속할까요?`))return;try{let d=await call("bulk_scores",{records});say(`완료: 저장 ${d.saved}건, 건너뜀 ${d.skipped}건, 형식 오류 ${invalid}건`,"success");$("bresult").innerHTML=`<div class="notice">저장 ${d.saved}건 · 건너뜀 ${d.skipped}건 · 형식 오류 ${invalid}건</div>`}catch(e){say(e.message,"error")}}}

</script></body></html>
