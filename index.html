

<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>기숙사 모의고사 성적 조회</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      padding: 24px 16px;

      background: #f5f6f8;

      color: #202124;

      font-family: -apple-system, BlinkMacSystemFont,

        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;

    }

    main {

      max-width: 440px;

      margin: 48px auto;

      padding: 28px 22px;

      background: white;

      border: 1px solid #e5e7eb;

      border-radius: 16px;

    }

    h1 { font-size: 23px; margin: 0 0 8px; }

    .description { color: #6b7280; font-size: 14px; line-height: 1.6; }

    label {

      display: block;

      margin: 20px 0 8px;

      font-size: 14px;

      font-weight: 600;

    }

    input, button {

      width: 100%;

      min-height: 48px;

      padding: 12px;

      border-radius: 9px;

      font: inherit;

    }

    input { border: 1px solid #d1d5db; }

    button {

      margin-top: 22px;

      border: 0;

      background: #202124;

      color: white;

      cursor: pointer;

    }

    button:disabled { opacity: 0.6; cursor: wait; }

    #message { margin-top: 16px; font-size: 14px; line-height: 1.6; }

    #results { margin-top: 24px; }

    .score-row {

      display: flex;

      justify-content: space-between;

      padding: 14px 0;

      border-bottom: 1px solid #eee;

    }

    .score-value { font-weight: 700; }

    .hidden { display: none; }

  </style>

</head>

<body>

  <main>

    <h1>기숙사 모의고사 성적 조회</h1>

    <p class="description">

      개인 식별코드와 생년월일을 입력해 성적을 확인하세요.

    </p>

    <form id="lookupForm">

      <label for="studentCode">개인 식별코드</label>

      <input

        id="studentCode"

        name="studentCode"

        type="text"

        maxlength="6"

        pattern="[A-Za-z0-9]{6}"

        autocomplete="off"

        autocapitalize="characters"

        placeholder="6자리 코드"

        required

      >

      <label for="birthdate">생년월일</label>

      <input

        id="birthdate"

        name="birthdate"

        type="text"

        inputmode="numeric"

        maxlength="8"

        pattern="[0-9]{8}"

        autocomplete="off"

        placeholder="예: 20080115"

        required

      >

      <button id="submitButton" type="submit">성적 조회</button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <section id="results" class="hidden" aria-label="조회 결과">

      <h2>조회 결과</h2>

      <div id="scoreList"></div>

    </section>

  </main>

  <script>

    // 아래 주소를 본인의 실제 함수 URL로 교체하세요.

    const FUNCTION_URL =

      "https://YOUR_PROJECT_ID.supabase.co/functions/v1/lookup-score";

    const form = document.getElementById("lookupForm");

    const codeInput = document.getElementById("studentCode");

    const birthInput = document.getElementById("birthdate");

    const button = document.getElementById("submitButton");

    const message = document.getElementById("message");

    const results = document.getElementById("results");

    const scoreList = document.getElementById("scoreList");

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const student_code = codeInput.value.trim().toUpperCase();

      const birthdate = birthInput.value.trim();

      results.classList.add("hidden");

      scoreList.replaceChildren();

      if (!/^[A-Z0-9]{6}$/.test(student_code)) {

        message.textContent = "식별코드는 영문 대문자와 숫자 6자리로 입력해 주세요.";

        return;

      }

      if (!/^\d{8}$/.test(birthdate)) {

        message.textContent = "생년월일은 숫자 8자리로 입력해 주세요.";

        return;

      }

      button.disabled = true;

      message.textContent = "성적을 조회하고 있습니다.";

      try {

        const response = await fetch(FUNCTION_URL, {

          method: "POST",

          headers: {

            "Content-Type": "application/json"

          },

          body: JSON.stringify({ student_code, birthdate })

        });

        const data = await response.json();

        if (!response.ok) {

          throw new Error(data.error || "조회에 실패했습니다.");

        }

        if (!Array.isArray(data.scores) || data.scores.length === 0) {

          message.textContent = "조회된 성적이 없습니다.";

          return;

        }

        for (const item of data.scores) {

          const row = document.createElement("div");

          row.className = "score-row";

          const subject = document.createElement("span");

          subject.textContent = item.subject;

          const score = document.createElement("span");

          score.className = "score-value";

          score.textContent = `${item.score}점`;

          row.append(subject, score);

          scoreList.append(row);

        }

        results.classList.remove("hidden");

        message.textContent = "성적 조회가 완료되었습니다.";

      } catch (error) {

        console.error(error);

        message.textContent =

          "조회에 실패했습니다. 잠시 후 다시 시도해 주세요.";

      } finally {

        button.disabled = false;

      }

    });

  </script>

</body>

</html>
