function renderReportData(data,studentCode,ids){const groups=new Map();(data.scores||[]).forEach(x=>{const p=resultParts(x.subject);if(!groups.has(p.exam))groups.set(p.exam,[]);groups.get(p.exam).push({...x,_parts:p})});const exams=[...groups.keys()].sort((a,b)=>b.localeCompare(a,"ko",{numeric:true}));const sel=$(ids.select);sel.innerHTML=exams.map(e=>`<option value="${esc(e)}">${esc(e)}</option>`).join("");const rankLabel=x=>x.rank!==null&&x.rank!==undefined&&x.rank!==""&&x.participant_count!==null&&x.participant_count!==undefined&&x.participant_count!==""?`${fmt(x.rank)} / ${fmt(x.participant_count)}`:"—";const paint=()=>{const selected=sel.value;const valid=(groups.get(selected)||[]).filter(x=>Number.isFinite(Number(x.score)));const dateMatch=selected.match(/응시일 (\d{4}-\d{2}-\d{2})/);$(ids.meta).innerHTML=`<div><span>응시 일자</span><strong>${esc(dateMatch?dateMatch[1]:"미등록")}</strong></div><div><span>개인식별코드</span><strong>${esc(studentCode)}</strong></div>`;const avg=valid.length?valid.reduce((a,x)=>a+Number(x.score),0)/valid.length:null;const ranks=valid.filter(x=>x.rank!==null&&x.rank!==undefined&&x.rank!==""&&x.participant_count!==null&&x.participant_count!==undefined&&x.participant_count!=="");$(ids.summary).innerHTML=`<div class="summary-item"><div class="summary-label">등록 과목 평균</div><div class="summary-value">${avg===null?"—":avg.toFixed(1)}<span class="summary-unit">점</span></div></div>`;if(!valid.length){$(ids.scores).innerHTML='<div class="empty">선택한 시험의 성적이 아직 등록되지 않았습니다.</div>';$(ids.cutoffs).innerHTML='<div class="empty">등록된 등급 기준 점수가 없습니다.</div>';return}$(ids.scores).innerHTML=`<div class="tablewrap report-score-wrap"><table class="table score-table report-score-table"><thead><tr><th>영역</th><th>원점수</th><th>과목 평균</th><th>석차</th><th>응시자 수</th><th>등급</th></tr></thead><tbody>${valid.map(x=>`<tr><td><strong>${esc(x._parts.subject)}</strong></td><td>${fmt(x.score)}점</td><td>${x.average===null||x.average===undefined?"—":fmt(Number(x.average))+"점"}</td><td>${x.rank===null||x.rank===undefined||x.rank===""?"—":fmt(x.rank)+"등"}</td><td>${x.participant_count===null||x.participant_count===undefined||x.participant_count===""?"—":fmt(x.participant_count)+"명"}</td><td>${x.grade?esc(x.grade)+"등급":"—"}</td></tr>`).join("")}</tbody></table></div>`;const cutMap=new Map();valid.flatMap(x=>(x.cutoffs||[]).map(c=>({...c,subject:x._parts.subject}))).filter(c=>!isEnglishSubject(c.subject)).forEach(c=>{const k=c.subject+"|"+c.grade;if(!cutMap.has(k))cutMap.set(k,c)});const bySubject=new Map();[...cutMap.values()].sort((a,b)=>a.subject.localeCompare(b.subject,"ko")||Number(a.grade)-Number(b.grade)).forEach(c=>{if(!bySubject.has(c.subject))bySubject.set(c.subject,[]);bySubject.get(c.subject).push(c)});$(ids.cutoffs).innerHTML=bySubject.size?`<div class="cutoff-grid">${[...bySubject].map(([subject,cs])=>`<div class="cutoff-item"><div class="cutoff-title">${esc(subject)}</div>${cs.map(c=>`<div class="cutoff-line"><span>${esc(c.grade)}등급</span><strong>${fmt(c.min_score)}점</strong></div>`).join("")}</div>`).join("")}</div>`:'<div class="empty">선택한 시험의 등급 기준 점수가 등록되지 않았습니다.</div>'};sel.onchange=paint;if(exams.length)paint();else{sel.innerHTML='<option value="">등록된 시험 없음</option>';$(ids.meta).innerHTML=`<div><span>응시 일자</span><strong>미등록</strong></div><div><span>개인식별코드</span><strong>${esc(studentCode)}</strong></div>`;$(ids.summary).innerHTML="";$(ids.scores).innerHTML='<div class="empty">등록된 성적이 없습니다.</div>';$(ids.cutoffs).innerHTML='<div class="empty">등록된 등급 기준 점수가 없습니다.</div>'}}

async function call(action,payload={}){if(!adminToken)throw Error("관리자 인증이 만료되었습니다. 다시 인증해 주세요.");const r=await fetch(ADMIN_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+adminToken},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({error:"서버 응답 오류"}));if(r.status===401){endAdminSession();throw Error(d.error||"관리자 인증이 만료되었습니다.")}if(!r.ok)throw Error(d.error||"요청 실패");return d}

const areaOptions=["국어 영역","수학 영역","영어 영역","사회탐구 영역","과학탐구 영역"];const cutoffAreaOptions=areaOptions.filter(x=>x!=="영어 영역");const schoolGradeOptions=["고1","고2","고3"];
function examLabel(year,event,date){return `${year}학년도 ${event} (응시일 ${date})`}
function composeSubject(year,event,date,schoolGrade,area){const y=String(year||"").trim(),e=String(event||"").trim(),d=String(date||"").trim(),g=String(schoolGrade||"").trim(),a=String(area||"").trim();if(!y||!e||!d||!schoolGradeOptions.includes(g)||!a)throw Error("학년도, 시험, 응시 학년, 응시 일자, 영역을 모두 입력해 주세요.");return `${examLabel(y,e,d)} / ${g} / ${a}`}
function parseSubject(value){const raw=String(value||"");const m=raw.match(/^(\d{4})학년도\s+(.+?)\s+(?:\/|·)\s+(.+)$/);return m?{year:m[1],type:m[2],subject:m[3]}:{year:"",type:"기타 시험",subject:raw}}
function examFields(prefix,cutoff=false){const years=[2025,2026],areas=cutoff?cutoffAreaOptions:areaOptions;return `<div class="field"><label for="${prefix}Year">학년도</label><select id="${prefix}Year" required><option value="">학년도 선택</option>${years.map(y=>`<option value="${y}">${y}학년도</option>`).join("")}</select></div><div class="field"><label for="${prefix}Type">시험 종류</label><select id="${prefix}Type" required><option value="">시험 선택</option>${examOptions.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label for="${prefix}SchoolGrade">응시 학년</label><select id="${prefix}SchoolGrade" required><option value="">학년 선택</option>${schoolGradeOptions.map(x=>`<option value="${x}">${x}</option>`).join("")}</select></div><div class="field"><label for="${prefix}Date">응시 일자</label><input id="${prefix}Date" type="date" required></div><div class="field"><label for="${prefix}Area">영역</label><select id="${prefix}Area" required><option value="">영역 선택</option>${areas.map(x=>`<option>${x}</option>`).join("")}</select>${cutoff?'<p class="field-note">영어는 절대평가이므로 등급 기준 점수를 직접 등록하지 않습니다.</p>':''}</div>`}function fullSubject(prefix){return $(prefix+"Area").value}

.value,subject=composeSubject($("cYear").value,$("cType").value,$("cDate").value,$("cSchoolGrade").value,fullSubject("c")),score=Number($("cscore").value);const duplicate=scores.find(sc=>sc.student_id===studentId&&sc.subject===subject&&String(sc.id)!==$("cid").value);if(duplicate&&!confirm(`동일한 학생, 시험, 과목의 성적이 이미 있습니다. 기존 항목과 별개로 저장할까요?`))return;try{await call("save_score",{score:{id:$("cid").value||null,student_id:studentId,subject,score}});say("성적을 등록했습니다.","success");const chosen={studentId,year:$("cYear").value,type:$("cType").value,schoolGrade:$("cSchoolGrade").value,date:$("cDate").value,area:$("cArea").value,score:$("cscore").value,q:$("cq").value};await render("scores");$("cstudent").value=chosen.studentId;$("cYear").value=chosen.year;$("cType").value=chosen.type;$("cSchoolGrade").value=chosen.schoolGrade;$("cDate").value=chosen.date;$("cArea").value=chosen.area;$("cscore").value=chosen.score;$("cq").value=chosen.q;$("cq").dispatchEvent(new Event("input"))}catch(e){say(e.message,"error")}};$("ct").onclick=async e=>{const d=e.target.closest("[data-cd]");if(!d)return;const sc=scores.find(x=>String(x.id)===d.dataset.cd);if(!confirm(`${sc.subject} 성적을 삭제할까요?`))return;try{await call("delete_score",{id:sc.id});say("성적을 삭제했습니다.","success");await render("scores")}catch(e){say(e.message,"error")}}}
function isEnglishSubject(value){return /(?:^|\s|\/|·)영어(?:\s*영역)?\s*$|(?:^|\s|\/|·)english\s*$/i.test(String(value||""))}function cutoffView(){content.innerHTML=`<div class="admin-title"><h2>등급 기준 관리</h2></div><form id="cutForm" class="formbox"><div class="grid2">${examFields("cut",true)}<div class="field"><label for="cutGrade">등급</label><select id="cutGrade" required>${[1,2,3,4,5,6,7,8,9].map(n=>`<option value="${n}">${n}등급</option>`).join("")}</select></div><div class="field"><label for="cutScore">기준 점수</label><input id="cutScore" type="number" min="0" max="100" step=".01" required></div></div><div class="actions"><button class="btn primary">기준 점수 등록</button></div></form><div class="search"><input id="cutSearch" placeholder="학년도, 시험 또는 과목 검색" aria-label="등급 기준 검색"></div><div id="cutTable"></div>`;const draw=()=>{const q=$("cutSearch").value.toLowerCase();const list=cutoffs.filter(c=>!isEnglishSubject(c.subject)&&c.subject.toLowerCase().includes(q)).sort((a,b)=>a.subject.localeCompare(b.subject,"ko")||Number(a.grade)-Number(b.grade));$("cutTable").innerHTML=list.length?`<div class="tablewrap"><table class="table"><thead><tr><th>시험 및 과목</th><th>등급</th><th>기준 점수</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td class="record-exam">${esc(String(c.subject).replaceAll(" · "," / "))}</td><td>${c.grade}등급</td><td>${fmt(c.min_score)}점</td><td><div class="row-actions"><button class="btn danger small" data-cutdel="${c.id}">삭제</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">조건에 맞는 기준 점수가 없습니다.</div>'};draw();$("cutSearch").oninput=draw;$("cutForm").onsubmit=async e=>{e.preventDefault();const subject=composeSubject($("cutYear").value,$("cutType").value,$("cutDate").value,$("cutSchoolGrade").value,fullSubject("cut")),grade=Number($("cutGrade").value),min_score=Number($("cutScore").value);const duplicate=cutoffs.find(c=>c.subject===subject&&Number(c.grade)===grade);if(duplicate&&!confirm(`같은 시험, 과목, 등급의 기준 점수가 이미 등록되어 있습니다. 중복 등록을 계속할까요?`))return;try{await call("save_cutoff",{subject,grade,min_score});const q=$("cutSearch").value;const d=await call("dashboard");cutoffs=d.cutoffs||[];draw();$("cutSearch").value=q;$("cutSearch").dispatchEvent(new Event("input"));say("등급 기준 점수를 등록했습니다.","success")}catch(e){say(e.message,"error")}};$("cutTable").onclick=async e=>{const b=e.target.closest("[data-cutdel]");if(!b)return;if(!confirm("이 기준 점수를 삭제할까요?"))return;try{await call("delete_cutoff",{id:b.dataset.cutdel});cutoffs=cutoffs.filter(x=>String(x.id)!==b.dataset.cutdel);draw();say("등급 기준 점수를 삭제했습니다.","success")}catch(e){say(e.message,"error")}}}
function previewView(){content.innerHTML=`<div class="admin-title"><h2>학생 성적 조회</h2><p class="muted">개인식별코드를 선택해 해당 학생의 성적표를 조회할 수 있습니다.</p></div><div class="formbox"><div class="field"><label for="previewStudent">개인식별코드</label><select id="previewStudent"><option value="">개인식별코드 선택</option>${students.slice().sort((a,b)=>a.student_code.localeCompare(b.student_code)).map(st=>`<option value="${st.id}">${esc(st.student_code)}</option>`).join("")}</select></div><button class="btn primary" id="openPreview">성적표 조회</button></div><div id="previewArea"></div>`;$("openPreview").onclick=async()=>{const st=students.find(x=>String(x.id)===$("previewStudent").value);if(!st){say("학생을 선택해 주세요.","error");return}try{const r=await fetch(ADMIN_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action:"lookup_student",student_code:st.student_code,birthdate:st.birthdate})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"학생 성적표를 불러오지 못했습니다.");$("previewArea").innerHTML=`<div class="preview-frame"><div class="preview-label">학생 성적표 미리보기</div><header class="result-head"><div><div class="eyebrow">CHEONGUN HAKSA / ACTUAL CHALLENGE</div><h1>모의고사 성적표</h1><p class="muted">응시한 시험을 선택해 성적을 확인할 수 있습니다.</p></div></header><section class="exam-picker"><label for="previewExamSelect">시험 선택</label><select id="previewExamSelect"></select></section><div class="result-meta" id="previewMeta"></div><section class="result-summary" id="previewSummary"></section><section class="result-section"><div class="section-head"><h2>과목별 성적</h2></div><div id="previewScores"></div></section><section class="result-section"><div class="section-head"><h2>등급 기준 점수</h2></div><div id="previewCutoffs" class="cutoff-table-wrap"></div></section></div>`;renderReportData(d,st.student_code,{select:"previewExamSelect",meta:"previewMeta",summary:"previewSummary",scores:"previewScores",cutoffs:"previewCutoffs"});say("학생 성적표를 불러왔습니다.","success")}catch(e){say(e.message,"error")}}}
function bulkView(){content.innerHTML=`<div class="admin-title"><h2>성적 일괄 등록</h2></div><form id="bf" class="formbox"><div class="field"><label for="bdata">성적 데이터</label><p class="field-note">입력 항목: 개인식별코드, 생년월일, 학년도, 시험명, 응시 학년(고1/고2/고3), 응시 일자, 영역, 원점수</p><p class="field-note">입력 예시: MXXXXX, YYYYMMDD, 2025, 3월, 고1, YYYY-MM-DD, 국어 영역, 100</p><textarea id="bdata" rows="7" required aria-label="성적 데이터"></textarea></div><div class="actions"><button class="btn primary" id="bulkSubmit">성적 일괄 등록</button></div></form>`;const form=$("bf");form.onsubmit=async e=>{e.preventDefault();const submit=$("bulkSubmit");if(submit.disabled)return;const lines=$("bdata").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const records=[],duplicates=[];const studentMap=new Map(students.map(st=>[String(st.student_code||"").toUpperCase(),st]));const scoreKeys=new Set(scores.map(sc=>`${sc.student_id}|${sc.subject}`));const aliases={"3월":"3월 전국연합학력평가","5월":"5월 전국연합학력평가","6월":"6월 대학수학능력시험 모의평가","7월":"7월 전국연합학력평가","9월":"9월 대학수학능력시험 모의평가","10월":"10월 전국연합학력평가","11월":"11월 대학수학능력시험"};const seen=new Set();for(let i=0;i<lines.length;i++){const c=(lines[i].includes("\t")?lines[i].split("\t"):lines[i].split(",")).map(x=>x.trim().replace(/^"|"$/g,""));if(i===0&&/student.?code|식별코드|개인식별코드/i.test(c[0]||""))continue;const month=(c[3]||"").replace(/\s+/g,"");const exam=aliases[month]||c[3];if(c.length<8||!/^[Mm][A-Za-z0-9]{5}$/.test(c[0]||"")||!/^[0-9]{8}$/.test(c[1]||"")||!/^202[56]$/.test(c[2]||"")||!examOptions.includes(exam)||!schoolGradeOptions.includes(c[4])||!/^\d{4}-\d{2}-\d{2}$/.test(c[5]||"")||!areaOptions.includes(c[6])||!Number.isFinite(Number(c[7]))||Number(c[7])<0||Number(c[7])>100)continue;const subject=composeSubject(c[2],exam,c[5],c[4],c[6]);const student=studentMap.get(c[0].toUpperCase());if(!student){duplicates.push({line:i+1,reason:`${c[0]} 학생이 등록되어 있지 않습니다.`});continue}const key=`${student.id}|${subject}`;if(scoreKeys.has(key)||seen.has(key))duplicates.push({line:i+1,reason:`${c[0]} / ${subject} 성적이 이미 등록되어 있습니다.`});seen.add(key);records.push({student_code:c[0].toUpperCase(),birthdate:c[1],subject,score:Number(c[7])})}if(!records.length){say("등록할 수 있는 성적 데이터가 없습니다.","error");return}if(duplicates.length&&!confirm(`${duplicates.length}건의 중복 또는 확인 항목이 있습니다. 계속 진행할까요?\n\n${duplicates.slice(0,8).map(x=>`행 ${x.line}: ${x.reason}`).join("\n")}${duplicates.length>8?"\n외 추가 항목":""}`))return;submit.disabled=true;const oldText=submit.textContent;submit.textContent="등록 중…";try{const d=await call("bulk_scores",{records});say(`원점수 ${d.saved}건을 등록했습니다.`,"success");}catch(err){say(err.message||"일괄 등록에 실패했습니다.","error")}finally{submit.disabled=false;submit.textContent=oldText}}}
</script></body></html>
